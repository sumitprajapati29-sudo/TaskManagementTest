name: TaskFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── Backend: Lint & Test ────────────────────────────────────────────────────
  backend:
    name: Backend – Install & Verify
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify server starts
        run: |
          timeout 10 node server.js &
          sleep 5
          curl -f http://localhost:5000/api/health || exit 1
          kill %1 || true

  # ── Frontend: Lint, Build & Test ────────────────────────────────────────────
  frontend:
    name: Frontend – Install & Build
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build output exists
        run: test -d dist && echo "Build successful"

  # ── Docker: Build & Deploy ──────────────────────────────────────────────────
  docker-deploy:
    name: Docker – Build & Deploy
    runs-on: self-hosted
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing containers
        run: docker compose down --remove-orphans || true

      - name: Build and start containers
        run: docker compose up --build -d
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 – waiting 5s..."
            sleep 5
          done
          echo "Backend failed to start"
          docker compose logs
          exit 1

      - name: Verify frontend is reachable
        run: curl -sf http://localhost:8080 > /dev/null && echo "Frontend is up!"

      - name: Show running containers
        if: always()
        run: docker compose ps

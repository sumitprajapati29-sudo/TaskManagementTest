name: TaskFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── Backend: Lint & Test ────────────────────────────────────────────────────
  backend:
    name: Backend – Install & Verify
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify server starts
        run: |
          $proc = Start-Process -FilePath "node" -ArgumentList "server.js" -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          try {
            $response = Invoke-WebRequest -Uri http://localhost:5000/api/health -UseBasicParsing
            if ($response.StatusCode -eq 200) {
              Write-Host "Backend health check passed!"
            } else {
              throw "Health check returned $($response.StatusCode)"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

  # ── Frontend: Lint, Build & Test ────────────────────────────────────────────
  frontend:
    name: Frontend – Install & Build
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build output exists
        run: |
          if (Test-Path -Path "dist" -PathType Container) {
            Write-Host "Build successful"
          } else {
            throw "dist directory not found"
          }

  # ── Docker: Build & Deploy ──────────────────────────────────────────────────
  docker-deploy:
    name: Docker – Build & Deploy
    runs-on: self-hosted
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing containers
        run: docker compose down --remove-orphans 2>$null; $true

      - name: Build and start containers
        run: docker compose up --build -d
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}

      - name: Wait for backend health check
        run: |
          Write-Host "Waiting for backend to be healthy..."
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri http://localhost:5000/api/health -UseBasicParsing -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "Backend is healthy!"
                exit 0
              }
            } catch {
              Write-Host "Attempt $i/30 - waiting 5s..."
              Start-Sleep -Seconds 5
            }
          }
          Write-Host "Backend failed to start"
          docker compose logs
          exit 1

      - name: Verify frontend is reachable
        run: |
          $response = Invoke-WebRequest -Uri http://localhost:8080 -UseBasicParsing
          if ($response.StatusCode -eq 200) { Write-Host "Frontend is up!" }
          else { throw "Frontend not reachable" }

      - name: Show running containers
        if: always()
        run: docker compose ps
